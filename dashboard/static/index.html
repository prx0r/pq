<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pq</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#0d1117;color:#e6edf3;display:flex;height:100vh}
#chat{flex:2;display:flex;flex-direction:column;border-right:1px solid #21262d}
#side{flex:1;min-width:300px;overflow-y:auto;padding:12px;background:#161b22}
#log{flex:1;overflow-y:auto;padding:16px}
.msg{margin-bottom:10px}.msg.you{color:#79c0ff}.msg small{color:#7d8590;font-size:12px}
#box{display:flex;padding:12px;gap:8px;border-top:1px solid #21262d}
#box input{flex:1;padding:10px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:inherit}
button{padding:8px 14px;border-radius:6px;border:0;background:#238636;color:#fff;cursor:pointer;font-size:13px}
button.ghost{background:#21262d}button.primary{background:#1f6feb}
.card{border:1px solid #21262d;border-radius:6px;padding:8px;margin-bottom:8px}
.card h3{margin:0 0 4px;font-size:12px;color:#7d8590}
.card p{margin:2px 0;font-size:12px}
.tag{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600}
.tag.queued{background:#1f6feb22;color:#58a6ff}.tag.running{background:#23863622;color:#3fb950}
.tag.done{background:#238636;color:#fff}.tag.failed{background:#da3633;color:#fff}
.section{margin:14px 0 6px;font-size:11px;color:#484f58;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #21262d;padding-bottom:4px}
textarea{width:100%;height:100px;padding:6px;border:1px solid #30363d;background:#0d1117;color:inherit;font:12px/1.3 monospace;border-radius:4px;resize:vertical}
input.cfg{width:100%;padding:5px;margin:2px 0;border-radius:3px;border:1px solid #30363d;background:#0d1117;color:inherit;font-size:12px}
label{font-size:10px;color:#7d8590;text-transform:uppercase}
.mi{display:flex;gap:4px;margin:6px 0}.mi input{flex:1;padding:6px;border-radius:3px;border:1px solid #30363d;background:#0d1117;color:inherit;font-size:12px}
@media(max-width:800px){body{flex-direction:column}#side{max-width:none;border-top:1px solid #21262d}}
</style>
</head>
<body>
<div id="chat">
  <div id="log"></div>
  <div id="box"><input id="in" placeholder="talk to Muse…" autocomplete="off"><button onclick="send()">Send</button></div>
</div>
<div id="side">
  <div class="section">System prompt</div>
  <textarea id="sys"></textarea>
  <div style="display:flex;gap:4px;margin-top:4px">
    <button class="ghost" onclick="lp()">Load</button>
    <button class="primary" onclick="sp()">Save</button>
    <span id="ps" style="font-size:11px;color:#7d8590;align-self:center"></span>
  </div>

  <div class="section">Dispatch</div>
  <div class="mi">
    <input id="mo" placeholder="e.g. find whale wallets">
    <button class="primary" onclick="dm()">Go</button>
  </div>

  <div class="section">Missions</div>
  <div id="missions"></div>

  <div class="section">Prizes</div>
  <div id="prizes"></div>

  <div class="section">Seen wallets</div>
  <div id="seen"></div>

  <div class="section">Config</div>
  <div class="card">
    <label>Model</label><input id="model" class="cfg" placeholder="muse-spark-1.3-contributor">
    <label>Base URL</label><input id="base" class="cfg" placeholder="https://opencode.ai/zen/go/v1">
    <button class="ghost" onclick="sp2()">Save</button>
    <div style="margin-top:6px"><label>API key</label>
    <input id="key" type="password" placeholder="paste key" autocomplete="off">
    <button onclick="sk()" style="margin-top:2px">Store</button></div>
    <p id="ks" style="font-size:11px;color:#7d8590"></p>
  </div>
</div>
<script>
const T=new URLSearchParams(location.search).get("token")||"";
const A=(m,p,b)=>fetch(p+"?token="+encodeURIComponent(T),{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const L=document.getElementById("log"),B=document.getElementById("in");
function S(w,t){const d=document.createElement("div");d.className="msg"+(w==="you"?" you":"");d.innerHTML="<small>"+w+"</small><br>"+t.replace(/</g,"&lt;");L.appendChild(d);L.scrollTop=L.scrollHeight}
async function send(){const v=B.value.trim();if(!v)return;B.value="";S("you",v);S("…","thinking");try{const r=await A("POST","/api/chat",{message:v});L.lastChild.remove();S("muse",r.reply||"(empty)")}catch(e){L.lastChild.remove();S("err",e)}}
B.onkeydown=e=>{if(e.key==="Enter")send()};
async function lp(){try{const r=await A("GET","/api/system-prompt");document.getElementById("sys").value=r.prompt||""}catch(e){}}
async function sp(){await A("POST","/api/system-prompt",{prompt:document.getElementById("sys").value});document.getElementById("ps").textContent="saved";setTimeout(()=>document.getElementById("ps").textContent="",2e3)}
async function dm(){const o=document.getElementById("mo").value.trim();if(!o)return;document.getElementById("mo").value="";S("dispatch",o);const r=await A("POST","/api/missions/dispatch",{objective:o,max_turns:8});S("mission",r.ok?"queued "+r.mission_id:"fail: "+r.error);lm()}
async function lm(){try{const r=await A("GET","/api/missions");const e=document.getElementById("missions");e.innerHTML="";(r.missions||[]).slice(0,6).forEach(m=>{const c=document.createElement("div");c.className="card";c.innerHTML='<h3>'+m.id+' <span class="tag '+m.status+'">'+m.status+'</span></h3><p>'+m.objective.slice(0,80)+'</p>';e.appendChild(c)})}catch(e){}}
async function lpr(){try{const r=await A("GET","/api/prizes");const e=document.getElementById("prizes");e.innerHTML="";const s=r.summary||{};if(s.total)e.innerHTML='<p style="font-size:12px;color:#7d8590">'+s.total+' prizes · $'+s.total_usd.toLocaleString()+'</p>';(r.prizes||[]).slice(0,5).forEach(p=>{const c=document.createElement("div");c.className="card";c.innerHTML='<p>'+p.chain+' · $'+p.balance_usd.toLocaleString()+(p.ens_name?' · '+p.ens_name:'')+(p.github_repos?.length?' · '+p.github_repos.length+' repos':'')+'</p>';e.appendChild(c)})}catch(e){}}
async function ls(){try{const r=await A("GET","/api/seen");const e=document.getElementById("seen");e.innerHTML='<p style="font-size:12px;color:#7d8590">'+r.stats.total+' wallets · '+r.stats.with_github+' with github · '+r.stats.with_prize+' with prize</p>'}catch(e){}}
async function sp2(){await A("POST","/api/provider",{base_url:document.getElementById("base").value,model:document.getElementById("model").value});S("agent","provider saved")}
async function sk(){const k=document.getElementById("key");if(!k.value)return;await A("POST","/api/vault-store",{name:"LLM_KEY",value:k.value});k.value="";document.getElementById("ks").textContent="stored";S("agent","key stored")}
lp();lm();lpr();ls();
setInterval(()=>{lm();lpr();ls()},8e3);
</script>
</body>
</html>
